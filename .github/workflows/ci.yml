name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with test extras)
        run: pip install ".[test]"
      - name: Byte-compile
        run: python -m compileall ica_mcp
      - name: Unit tests (offline helpers only — live API needs a Swedish IP)
        run: pytest -q
